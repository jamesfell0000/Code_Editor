<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Editor</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1e24" id="meta-theme-color">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/material-darker.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/eclipse.min.css">
    
    <style>
        /* Material Design 3 Tonal Palette */
        :root {
            --md-sys-color-primary: #0061a4;
            --md-sys-color-on-primary: #ffffff;
            --md-sys-color-primary-container: #d1e4ff;
            --md-sys-color-on-primary-container: #001d36;
            --md-sys-color-secondary-container: #cde5ff;
            --md-sys-color-on-secondary-container: #001d32;
            --md-sys-color-surface: #fdfbff;
            --md-sys-color-on-surface: #1a1c1e;
            --md-sys-color-surface-variant: #dfe2e6;
            --md-sys-color-on-surface-variant: #43474e;
            --md-sys-color-surface-container-low: #f7f9fd;
            --md-sys-color-surface-container: #f1f4f9;
            --md-sys-color-surface-container-high: #eceef4;
            --md-sys-color-outline: #73777f;
            --md-sys-color-outline-variant: #c3c6cf;
            --invisible-char: #73777f80;
        }

        [data-theme="dark"] {
            --md-sys-color-primary: #9ecaff;
            --md-sys-color-on-primary: #003258;
            --md-sys-color-primary-container: #00497d;
            --md-sys-color-on-primary-container: #d1e4ff;
            --md-sys-color-secondary-container: #00497d;
            --md-sys-color-on-secondary-container: #cde5ff;
            --md-sys-color-surface: #1a1c1e;
            --md-sys-color-on-surface: #e2e2e6;
            --md-sys-color-surface-variant: #43474e;
            --md-sys-color-on-surface-variant: #c3c6cf;
            --md-sys-color-surface-container-low: #1e2022;
            --md-sys-color-surface-container: #222528;
            --md-sys-color-surface-container-high: #282a2f;
            --md-sys-color-outline: #8d9199;
            --md-sys-color-outline-variant: #43474e;
            --invisible-char: #8d919980;
        }

        body {
            margin: 0;
            font-family: 'Roboto', system-ui, sans-serif;
            display: flex;
            height: 100vh;
            background-color: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-size: 20px;
        }

        .app-container { display: flex; flex-direction: column; flex-grow: 1; height: 100%; position: relative; }

        .sidebar-overlay {
            display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5); z-index: 99; transition: opacity 0.3s;
        }
        .sidebar-overlay.open { display: block; }

        .sidebar {
            position: absolute; top: 0; left: -320px; width: 300px; height: 100%;
            background-color: var(--md-sys-color-surface-container-low); z-index: 100;
            transition: left 0.3s cubic-bezier(0.2, 0, 0, 1); padding: 24px 12px;
            display: flex; flex-direction: column; border-radius: 0 16px 16px 0;
            box-sizing: border-box; overflow-y: auto;
        }
        .sidebar.open { left: 0; }

        .drawer-header { padding: 0 16px 24px 16px; font-size: 22px; font-weight: 500; }
        .menu-title { padding: 16px 16px 8px 16px; font-size: 14px; font-weight: 500; color: var(--md-sys-color-on-surface-variant); }

        .md3-nav-item {
            background: transparent; color: var(--md-sys-color-on-surface); border: none;
            padding: 0 16px; height: 56px; cursor: pointer; border-radius: 100px;
            font-size: 14px; font-weight: 500; display: flex; align-items: center;
            gap: 12px; width: 100%; transition: background-color 0.2s; text-align: left; margin-bottom: 2px;
        }
        .md3-nav-item:hover { background-color: var(--md-sys-color-surface-variant); }
        .md3-nav-item.active { background-color: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }
        .md3-nav-item.active .material-symbols-outlined { font-variation-settings: 'FILL' 1; }

        .md3-select-wrapper { padding: 0 16px; margin-bottom: 8px; }
        .md3-select {
            width: 100%; background-color: var(--md-sys-color-surface-container-high);
            color: var(--md-sys-color-on-surface); border: 1px solid var(--md-sys-color-outline-variant);
            padding: 16px; border-radius: 8px; font-size: 14px; font-family: inherit; cursor: pointer;
        }

        .workspace-header { display: flex; background-color: var(--md-sys-color-surface); align-items: center; padding-left: 8px; min-height: 56px; }
        .icon-btn {
            background: transparent; border: none; color: var(--md-sys-color-on-surface);
            width: 48px; height: 48px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: background-color 0.2s;
        }
        .icon-btn:hover { background-color: var(--md-sys-color-surface-variant); }

        .tabs-container {
            display: flex; flex-grow: 1; overflow-x: auto; align-items: flex-end;
            height: 100%; padding-left: 12px; scrollbar-width: none;
        }
        .tabs-container::-webkit-scrollbar { display: none; }

        .tab {
            background-color: transparent; color: var(--md-sys-color-on-surface-variant);
            height: 48px; padding: 0 16px; font-size: 14px; font-weight: 500;
            cursor: pointer; display: flex; align-items: center; gap: 8px; position: relative;
            transition: color 0.2s; border-bottom: 3px solid transparent; white-space: nowrap;
        }
        .tab:hover { color: var(--md-sys-color-on-surface); background-color: var(--md-sys-color-surface-container); }
        .tab.active { color: var(--md-sys-color-primary); border-bottom-color: var(--md-sys-color-primary); }
        
        .tab .close-tab {
            border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center;
            justify-content: center; font-size: 16px; color: var(--md-sys-color-on-surface-variant);
        }
        .tab .close-tab:hover { background-color: var(--md-sys-color-surface-variant); color: var(--md-sys-color-on-surface); }
        .tab.unsaved::after { content: '*'; color: var(--md-sys-color-primary); font-size: 18px; margin-left: -4px; }

        #editor-container { flex-grow: 1; position: relative; }
        .CodeMirror {
            position: absolute; top: 0; bottom: 0; left: 0; right: 0;
            height: 100%; font-family: "Fira Code", "Consolas", monospace; font-size: 15px;
        }

        .show-invisibles .CodeMirror-line::after { content: "¶"; color: var(--invisible-char); pointer-events: none; padding-left: 4px; }
        .show-invisibles .cm-tab { position: relative; border-bottom: 1px dotted var(--invisible-char); }
        .show-invisibles .cm-tab::after { content: '→'; position: absolute; color: var(--invisible-char); right: 4px; pointer-events: none; }

        .status-bar {
            background-color: var(--md-sys-color-surface-container); color: var(--md-sys-color-on-surface-variant);
            padding: 0 16px; height: 32px; font-size: 12px; font-weight: 500;
            display: flex; align-items: center; justify-content: space-between; user-select: none;
        }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <nav class="sidebar" id="sidebar">
        <div class="drawer-header">Code Editor</div>
        
        <div class="menu-title">File</div>
        <button class="md3-nav-item" id="menuNew"><span class="material-symbols-outlined">note_add</span> New File</button>
        <button class="md3-nav-item" id="menuOpen"><span class="material-symbols-outlined">folder_open</span> Open File</button>
        <button class="md3-nav-item" id="menuSave"><span class="material-symbols-outlined">save</span> Save</button>
        <button class="md3-nav-item" id="menuSaveAs"><span class="material-symbols-outlined">save_as</span> Save As...</button>

        <div class="menu-title">Language Mode</div>
        <div class="md3-select-wrapper">
            <select class="md3-select" id="menuMode">
                <option value="text/plain">Plain Text</option>
                <option value="python">Python</option>
                <option value="r">R</option>
                <option value="htmlmixed">HTML</option>
                <option value="julia">Julia</option>
            </select>
        </div>

        <div class="menu-title">View Options</div>
        <button class="md3-nav-item active" id="menuWrap"><span class="material-symbols-outlined">wrap_text</span> Word Wrap</button>
        <button class="md3-nav-item" id="menuInvisibles"><span class="material-symbols-outlined">segment</span> Show Invisibles</button>

        <div class="menu-title">App</div>
        <button class="md3-nav-item" id="menuTheme"><span class="material-symbols-outlined" id="themeIcon">light_mode</span> Swap Theme</button>
        <button class="md3-nav-item" id="btnInstall" style="display:none; color: var(--md-sys-color-primary);"><span class="material-symbols-outlined">install_desktop</span> Install App</button>
    </nav>

    <div class="app-container">
        <header class="workspace-header">
            <button class="icon-btn" id="hamburgerBtn" title="Menu"><span class="material-symbols-outlined">menu</span></button>
            <div class="tabs-container" id="tabsContainer"></div>
            <button class="icon-btn" id="addTabBtn" title="New Tab" style="margin-right: 8px;"><span class="material-symbols-outlined">add</span></button>
        </header>

        <main id="editor-container">
            <textarea id="editor"></textarea>
        </main>

        <footer class="status-bar">
            <span id="statusBarMode">Plain Text</span>
            <span id="statusBarFileStatus">Saved</span>
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/r/r.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/julia/julia.min.js"></script>

    <script>
        let tabs = [];
        let activeTabId = null;
        let autosaveTimeout = null;

        const editor = CodeMirror.fromTextArea(document.getElementById('editor'), {
            lineNumbers: true,
            theme: 'material-darker',
            indentUnit: 4,
            tabSize: 4,
            lineWrapping: true
        });

        const htmlDoc = document.documentElement;
        const tabsContainer = document.getElementById('tabsContainer');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const menuMode = document.getElementById('menuMode');
        const statusBarMode = document.getElementById('statusBarMode');
        const statusBarStatus = document.getElementById('statusBarFileStatus');
        const editorWrapper = editor.getWrapperElement();

        // -----------------------------------------------------
        // SESSION MANAGEMENT (Autosave & Restore)
        // -----------------------------------------------------
        function saveSession() {
            // Convert open tabs into stringifiable data
            const sessionData = tabs.map(tab => ({
                id: tab.id,
                name: tab.name,
                content: tab.doc.getValue(),
                mode: tab.mode,
                isUnsaved: tab.isUnsaved
            }));

            localStorage.setItem('codeEditorSession', JSON.stringify({
                tabs: sessionData,
                activeTabId: activeTabId
            }));
        }

        function loadSession() {
            const stored = localStorage.getItem('codeEditorSession');
            if (stored) {
                try {
                    const session = JSON.parse(stored);
                    if (session.tabs && session.tabs.length > 0) {
                        session.tabs.forEach(t => {
                            const doc = CodeMirror.Doc(t.content, t.mode);
                            tabs.push({
                                id: t.id,
                                name: t.name,
                                handle: null, // OS File Handles cannot be restored for security reasons
                                doc: doc,
                                isUnsaved: t.isUnsaved,
                                mode: t.mode
                            });
                        });
                        
                        // Restore active tab
                        const targetId = session.activeTabId && tabs.find(t => t.id === session.activeTabId) 
                            ? session.activeTabId 
                            : tabs[0].id;
                            
                        renderTabs();
                        switchActiveTab(targetId);
                        return; // Exit if successful
                    }
                } catch (err) {
                    console.error("Failed to parse session data", err);
                }
            }
            // Fallback if no session exists or parsing fails
            createNewTab();
        }

        // -----------------------------------------------------
        // UI & EDITOR LOGIC
        // -----------------------------------------------------
        function toggleSidebar() {
            sidebar.classList.toggle('open');
            sidebarOverlay.classList.toggle('open');
        }
        document.getElementById('hamburgerBtn').addEventListener('click', toggleSidebar);
        sidebarOverlay.addEventListener('click', toggleSidebar);

        function getModeByExtension(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            switch(ext) {
                case 'py': return 'python';
                case 'r': return 'r';
                case 'html': case 'htm': return 'htmlmixed';
                case 'jl': return 'julia';
                default: return 'text/plain';
            }
        }

        function createNewTab(name = "Untitled", content = "", handle = null) {
            const mode = getModeByExtension(name);
            const id = 'tab-' + Date.now();
            const doc = CodeMirror.Doc(content, mode);
            
            tabs.push({ id, name, handle, doc, isUnsaved: false, mode });
            renderTabs();
            switchActiveTab(id);
            saveSession();
        }

        function switchActiveTab(id) {
            const tab = tabs.find(t => t.id === id);
            if (!tab) return;
            
            activeTabId = id;
            editor.swapDoc(tab.doc);
            
            menuMode.value = tab.mode;
            statusBarMode.textContent = menuMode.options[menuMode.selectedIndex].text;
            statusBarStatus.textContent = tab.isUnsaved ? 'Unsaved (Autosaved)' : 'Saved';
            
            renderTabs();
            saveSession();
            editor.focus();
        }

        function closeTab(id, e) {
            if (e) e.stopPropagation();
            const tabIndex = tabs.findIndex(t => t.id === id);
            if (tabIndex === -1) return;

            // Optional: you could remove this confirm dialog since it autosaves anyway, 
            // but keeping it prevents accidental destruction of the file context.
            if (tabs[tabIndex].isUnsaved && !confirm(`Close ${tabs[tabIndex].name}? Unsaved changes to the local file will be lost.`)) return;

            tabs.splice(tabIndex, 1);

            if (tabs.length === 0) {
                createNewTab();
            } else if (activeTabId === id) {
                switchActiveTab(tabs[Math.max(0, tabIndex - 1)].id);
            } else {
                renderTabs();
                saveSession();
            }
        }

        function renderTabs() {
            tabsContainer.innerHTML = '';
            tabs.forEach(tab => {
                const tabEl = document.createElement('div');
                tabEl.className = `tab ${tab.id === activeTabId ? 'active' : ''} ${tab.isUnsaved ? 'unsaved' : ''}`;
                tabEl.addEventListener('click', () => switchActiveTab(tab.id));
                
                const titleSpan = document.createElement('span');
                titleSpan.textContent = tab.name;
                tabEl.appendChild(titleSpan);
                
                const closeBtn = document.createElement('span');
                closeBtn.className = 'material-symbols-outlined close-tab';
                closeBtn.textContent = 'close';
                closeBtn.addEventListener('click', (e) => closeTab(tab.id, e));
                tabEl.appendChild(closeBtn);
                
                tabsContainer.appendChild(tabEl);
            });
        }

        function getCurrentTab() { return tabs.find(t => t.id === activeTabId); }

        // Trigger autosave whenever the user types
        editor.on('change', () => {
            const currentTab = getCurrentTab();
            if (!currentTab) return;

            // Only mark unsaved if it's an actual user edit (history > 0)
            if (!currentTab.isUnsaved && currentTab.doc.historySize().undo > 0) {
                currentTab.isUnsaved = true;
                renderTabs();
            }
            
            statusBarStatus.textContent = 'Saving...';
            
            // Debounce the autosave to run 1 second after typing stops
            clearTimeout(autosaveTimeout);
            autosaveTimeout = setTimeout(() => {
                saveSession();
                statusBarStatus.textContent = currentTab.isUnsaved ? 'Unsaved (Autosaved)' : 'Saved';
            }, 1000);
        });

        // -----------------------------------------------------
        // FILE OPERATIONS
        // -----------------------------------------------------
        document.getElementById('menuNew').addEventListener('click', () => { createNewTab(); toggleSidebar(); });
        document.getElementById('addTabBtn').addEventListener('click', () => createNewTab());

        document.getElementById('menuOpen').addEventListener('click', async () => {
            toggleSidebar();
            try {
                const [handle] = await window.showOpenFilePicker();
                const file = await handle.getFile();
                const text = await file.text();
                createNewTab(file.name, text, handle);
            } catch (err) { console.warn('Open aborted:', err); }
        });

        async function fileSaveAction() {
            const currentTab = getCurrentTab();
            if (!currentTab) return;
            
            // If it doesn't have an OS handle, we must use "Save As"
            if (!currentTab.handle) return await fileSaveAsAction();

            try {
                const writable = await currentTab.handle.createWritable();
                await writable.write(editor.getValue());
                await writable.close();
                currentTab.isUnsaved = false;
                statusBarStatus.textContent = 'Saved';
                renderTabs();
                saveSession();
                return true;
            } catch (err) { console.error('Save failed:', err); return false; }
        }

        async function fileSaveAsAction() {
            const currentTab = getCurrentTab();
            if (!currentTab) return;
            try {
                const handle = await window.showSaveFilePicker({ suggestedName: currentTab.name });
                currentTab.handle = handle;
                const file = await handle.getFile();
                currentTab.name = file.name;
                currentTab.mode = getModeByExtension(file.name);
                currentTab.doc.setMode(currentTab.mode);
                menuMode.value = currentTab.mode;
                return await fileSaveAction();
            } catch (err) { console.warn('Save As aborted:', err); return false; }
        }

        document.getElementById('menuSave').addEventListener('click', () => { fileSaveAction(); toggleSidebar(); });
        document.getElementById('menuSaveAs').addEventListener('click', () => { fileSaveAsAction(); toggleSidebar(); });

        // -----------------------------------------------------
        // CONFIG OPTIONS
        // -----------------------------------------------------
        menuMode.addEventListener('change', (e) => {
            const currentTab = getCurrentTab();
            if (currentTab) {
                currentTab.mode = e.target.value;
                editor.setOption('mode', e.target.value);
                statusBarMode.textContent = menuMode.options[menuMode.selectedIndex].text;
                saveSession();
            }
        });

        const menuWrap = document.getElementById('menuWrap');
        menuWrap.addEventListener('click', () => {
            const wrap = !editor.getOption('lineWrapping');
            editor.setOption('lineWrapping', wrap);
            menuWrap.classList.toggle('active', wrap);
        });

        const menuInvisibles = document.getElementById('menuInvisibles');
        menuInvisibles.addEventListener('click', () => {
            const active = editorWrapper.classList.toggle('show-invisibles');
            menuInvisibles.classList.toggle('active', active);
            editor.refresh();
        });

        document.getElementById('menuTheme').addEventListener('click', () => {
            const isDark = htmlDoc.getAttribute('data-theme') === 'dark';
            const target = isDark ? 'light' : 'dark';
            htmlDoc.setAttribute('data-theme', target);
            editor.setOption('theme', isDark ? 'eclipse' : 'material-darker');
            document.getElementById('meta-theme-color').content = isDark ? '#fdfbff' : '#1e1e24';
            document.getElementById('themeIcon').textContent = isDark ? 'dark_mode' : 'light_mode';
        });

        // Initialize App by loading previous session
        loadSession();

        // -----------------------------------------------------
        // PWA CONFIG
        // -----------------------------------------------------
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
        }

        let installPrompt;
        const btnInstall = document.getElementById('btnInstall');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); installPrompt = e; btnInstall.style.display = 'flex';
        });
        btnInstall.addEventListener('click', () => {
            if (installPrompt) {
                installPrompt.prompt();
                installPrompt.userChoice.then((choice) => {
                    if (choice.outcome === 'accepted') btnInstall.style.display = 'none';
                    installPrompt = null;
                });
            }
        });
    </script>
</body>
</html>

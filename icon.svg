<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- M3 Primary Gradient -->
        <linearGradient id="m3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0061a4"/>
            <stop offset="100%" stop-color="#9ecaff"/>
        </linearGradient>
    </defs>
    
    <!-- Material 3 Surface Background -->
    <rect width="512" height="512" rx="120" fill="#e8eaed"/>
    
    <!-- Unified Icon Group -->
    <g stroke-linecap="round" stroke-linejoin="round" stroke-width="56">
        <!-- Brackets (Dark Neutral) -->
        <path d="M 175 180 L 115 256 L 175 332" 
              fill="none" 
              stroke="#43474e"/>
        
        <path d="M 337 180 L 397 256 L 337 332" 
              fill="none" 
              stroke="#43474e"/>
        
        <!-- Forward Slash (Primary Gradient) -->
